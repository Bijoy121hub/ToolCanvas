<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer | ToolCanvas</title>
    <meta name="description" content="Resize your images quickly to custom dimensions, percentages, or social media presets.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300f5ff'/><circle cx='50' cy='50' r='25' fill='%230a0a1a'/></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
    <div class="background-effects">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>
    </div>

    <header class="tool-header" id="tool-nav"></header>

    <main class="container">
        <div class="tool-section glass-card fade-in-up">
            <h1 class="text-gradient">Image Resizer</h1>
            <p class="text-muted">Resize images accurately with zero quality loss.</p>

            <div id="upload-section">
                <div class="file-upload-zone glass-panel mt-2" id="resizer-drop-zone">
                    <div class="upload-icon">🖼️</div>
                    <h3>Drag & Drop Image Here</h3>
                    <p class="text-muted">Supports JPG, PNG, WEBP</p>
                    <input type="file" id="resizer-input" accept="image/jpeg, image/png, image/webp" class="hidden-input">
                    <button class="btn btn-primary mt-1" onclick="document.getElementById('resizer-input').click()">Browse Image</button>
                </div>
            </div>

            <div id="editor-section" class="hidden mt-2">
                <div class="grid-2-col">
                    <div class="glass-panel text-center">
                        <h3 class="mb-1">Original Image</h3>
                        <img id="original-preview" class="image-preview" src="" alt="Original Preview">
                        <div class="file-info mt-1" id="original-info">
                            <!-- Info will be populated by JS -->
                        </div>
                    </div>

                    <div class="glass-panel">
                        <h3 class="mb-1">Resize Options</h3>
                        
                        <div class="tab-header sm-tabs mb-1">
                            <button class="tab-btn active" data-target="mode-custom">Custom</button>
                            <button class="tab-btn" data-target="mode-percent">Percentage</button>
                            <button class="tab-btn" data-target="mode-preset">Presets</button>
                        </div>

                        <div id="mode-custom" class="tab-content active resize-mode">
                            <div class="dimension-inputs">
                                <div class="input-group">
                                    <label>Width (px)</label>
                                    <input type="number" id="custom-width" class="form-control" min="1">
                                </div>
                                <button id="lock-aspect" class="btn btn-icon locked" title="Lock Aspect Ratio">🔒</button>
                                <div class="input-group">
                                    <label>Height (px)</label>
                                    <input type="number" id="custom-height" class="form-control" min="1">
                                </div>
                            </div>
                        </div>

                        <div id="mode-percent" class="tab-content resize-mode">
                            <div class="input-group">
                                <label>Scale Percentage (%)</label>
                                <input type="number" id="percent-scale" class="form-control" value="50" min="1" max="500">
                            </div>
                        </div>

                        <div id="mode-preset" class="tab-content resize-mode">
                            <div class="input-group">
                                <label>Select Preset</label>
                                <select id="preset-select" class="form-control">
                                    <option value="1080x1080">Instagram Post (1080x1080)</option>
                                    <option value="1080x1920">Instagram Story (1080x1920)</option>
                                    <option value="820x312">Facebook Cover (820x312)</option>
                                    <option value="1500x500">Twitter Header (1500x500)</option>
                                    <option value="1280x720">YouTube Thumbnail (1280x720)</option>
                                    <option value="1920x1080">Wallpaper HD (1920x1080)</option>
                                    <option value="3840x2160">Wallpaper 4K (3840x2160)</option>
                                    <option value="600x600">Passport Photo (600x600)</option>
                                    <option value="256x256">Icon (256x256)</option>
                                </select>
                            </div>
                        </div>

                        <div class="output-options mt-2 pt-2 border-top">
                            <div class="input-group">
                                <label>Output Format</label>
                                <select id="output-format" class="form-control">
                                    <option value="image/jpeg">JPG</option>
                                    <option value="image/png">PNG</option>
                                    <option value="image/webp">WEBP</option>
                                </select>
                            </div>
                            <div class="input-group" id="quality-group">
                                <label>Quality: <span id="quality-val">0.9</span></label>
                                <input type="range" id="output-quality" min="0.1" max="1.0" step="0.1" value="0.9">
                            </div>
                        </div>

                        <button id="apply-resize-btn" class="btn btn-primary btn-full mt-2 glow-effect">Resize Image</button>
                    </div>
                </div>
            </div>

            <div id="result-section" class="hidden mt-2 glass-panel text-center fade-in">
                <h2 class="success-text mb-1">Image Resized Successfully!</h2>
                
                <div class="result-comparison mt-2">
                    <div class="stat-box">
                        <h4>Original Size</h4>
                        <p id="stat-orig-size" class="text-xl">--</p>
                    </div>
                    <div class="stat-box">
                        <h4>New Size</h4>
                        <p id="stat-new-size" class="text-xl">--</p>
                    </div>
                    <div class="stat-box highlight">
                        <h4>Change</h4>
                        <p id="stat-diff" class="text-xl">--</p>
                    </div>
                </div>

                <div class="mt-2">
                    <img id="resized-preview" class="image-preview" src="" alt="Resized Preview">
                </div>

                <div class="mt-2">
                    <a id="download-btn" class="btn btn-primary btn-lg" download="resized_image">Download Image</a>
                    <button id="reset-btn" class="btn btn-secondary ml-1">Resize Another</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/resizer.js"></script>
</body>
</html>
