<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - ToolCanvas</title>
    <meta name="description" content="Generate strong, secure, and customizable passwords instantly.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300f5ff'/><path d='M30 70 L50 30 L70 70' stroke='white' stroke-width='8' fill='none'/></svg>">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .password-display-container {
            position: relative;
            margin-bottom: 2rem;
        }
        .password-display {
            font-family: monospace;
            font-size: 2rem;
            text-align: center;
            padding: 2rem;
            word-break: break-all;
            color: var(--text-primary);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            letter-spacing: 2px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .copy-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .strength-meter {
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.1);
            margin-top: 1rem;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }
        .strength-label {
            text-align: right;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            font-weight: 500;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.02);
            padding: 1rem;
            border-radius: 12px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255,255,255,0.1);
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--primary);
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        input[type=range] {
            width: 100%;
            accent-color: var(--primary);
        }
        .batch-section, .history-section {
            margin-top: 2rem;
        }
        .pwd-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .pwd-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            font-family: monospace;
        }
        .pwd-item button {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .pwd-item button:hover {
            background: var(--primary);
            color: #000;
        }
        .batch-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>
    </div>
    
    <div class="app-container">
        <header class="tool-header" id="tool-nav"></header>
        
        <main class="tool-body">
            <div class="tool-section glass-card">
                <div class="password-display-container">
                    <div id="password-display" class="password-display">Loading...</div>
                    <button id="copy-btn" class="copy-btn">Copy</button>
                    <div class="strength-meter">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <div id="strength-label" class="strength-label">Strong</div>
                </div>

                <div class="controls-grid">
                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <label>Password Length</label>
                            <span id="length-val" style="color: var(--primary); font-weight: bold;">16</span>
                        </div>
                        <input type="range" id="length-slider" min="4" max="128" value="16">
                    </div>

                    <div class="control-group">
                        <label>Uppercase (A-Z)</label>
                        <label class="switch">
                            <input type="checkbox" id="chk-uppercase" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="control-group">
                        <label>Lowercase (a-z)</label>
                        <label class="switch">
                            <input type="checkbox" id="chk-lowercase" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="control-group">
                        <label>Numbers (0-9)</label>
                        <label class="switch">
                            <input type="checkbox" id="chk-numbers" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="control-group">
                        <label>Symbols (!@#$...)</label>
                        <label class="switch">
                            <input type="checkbox" id="chk-symbols" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="control-group">
                        <label>Exclude Ambiguous (l, 1, I, O, 0)</label>
                        <label class="switch">
                            <input type="checkbox" id="chk-ambiguous">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <button id="generate-btn" class="btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 1rem; font-size: 1.1rem;">Generate Password</button>
            </div>

            <div class="tool-section glass-card batch-section">
                <h3>Generate Multiple</h3>
                <div class="batch-controls">
                    <input type="number" id="batch-count" class="input-field" value="5" min="1" max="20" style="width: 100px;">
                    <button id="batch-generate-btn" class="btn-secondary">Generate Batch</button>
                </div>
                <ul id="batch-list" class="pwd-list"></ul>
            </div>

            <div class="tool-section glass-card history-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3>Password History</h3>
                    <button id="clear-history-btn" class="btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">Clear</button>
                </div>
                <ul id="history-list" class="pwd-list"></ul>
            </div>
        </main>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/password.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof createToolNav === 'function') {
                createToolNav('password');
            }
        });
    </script>
</body>
</html>
