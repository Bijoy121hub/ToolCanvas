<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolCanvas - Advanced Calculator</title>
    <meta name="description" content="Percentage, discount, tip, and change calculators.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300f5ff'/></svg>">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { padding: 10px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; cursor: pointer; border-radius: 999px; white-space: nowrap; }
        .tab-btn.active { background: #00f5ff; color: #000; font-weight: bold; }
        .tab-content { display: none; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(20px); }
        .tab-content.active { display: block; }
        .calc-group { margin-bottom: 15px; }
        .calc-group label { display: block; margin-bottom: 5px; color: #94a3b8; }
        .calc-group input { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff; }
        .calc-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .calc-row input { width: 100px; }
        .result { font-size: 24px; font-weight: bold; background: linear-gradient(to right, #00f5ff, #8b5cf6); -webkit-background-clip: text; color: transparent; margin-top: 10px; }
        .bar-container { width: 100%; height: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .bar-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.3s ease; }
        .tip-btns { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .tip-btn { padding: 5px 15px; border-radius: 999px; background: rgba(255,255,255,0.1); border: none; color: #fff; cursor: pointer; }
        .tip-btn.active { background: #8b5cf6; }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
    </div>
    
    <header class="tool-header" id="tool-nav"></header>

    <main class="tool-container">
        <h1>Calculators</h1>
        <div class="tabs">
            <button class="tab-btn active" data-tab="percentage">Percentage</button>
            <button class="tab-btn" data-tab="discount">Discount</button>
            <button class="tab-btn" data-tab="change">% Change</button>
            <button class="tab-btn" data-tab="tip">Tip Calculator</button>
        </div>

        <div id="percentage" class="tab-content active">
            <h2>Percentage Calculator</h2>
            <div class="calc-group">
                <label>What is X% of Y?</label>
                <div class="calc-row">
                    What is <input type="number" id="p1-x" value="10"> % of <input type="number" id="p1-y" value="100">?
                </div>
                <div class="result" id="p1-result">10</div>
            </div>
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
            <div class="calc-group">
                <label>X is what % of Y?</label>
                <div class="calc-row">
                    <input type="number" id="p2-x" value="10"> is what % of <input type="number" id="p2-y" value="50">?
                </div>
                <div class="result" id="p2-result">20%</div>
            </div>
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
            <div class="calc-group">
                <label>X is Y% of what?</label>
                <div class="calc-row">
                    <input type="number" id="p3-x" value="10"> is <input type="number" id="p3-y" value="20"> % of what?
                </div>
                <div class="result" id="p3-result">50</div>
            </div>
        </div>

        <div id="discount" class="tab-content">
            <h2>Discount Calculator</h2>
            <div class="calc-group">
                <label>Original Price</label>
                <input type="number" id="d-price" value="100" min="0">
            </div>
            <div class="calc-group">
                <label>Discount %</label>
                <input type="number" id="d-discount" value="20" min="0" max="100">
            </div>
            <div class="calc-group">
                <label>Tax % (Optional, applied after discount)</label>
                <input type="number" id="d-tax" value="0" min="0">
            </div>
            <div class="result" style="font-size: 18px;">
                Price after discount: $<span id="d-final-price">80.00</span><br>
                Total savings: $<span id="d-savings">20.00</span>
            </div>
            <div class="bar-container">
                <div class="bar-fill" id="d-bar" style="width: 80%;"></div>
            </div>
        </div>

        <div id="change" class="tab-content">
            <h2>Percentage Change</h2>
            <div class="calc-group">
                <label>From Value</label>
                <input type="number" id="c-from" value="100">
            </div>
            <div class="calc-group">
                <label>To Value</label>
                <input type="number" id="c-to" value="120">
            </div>
            <div class="result" id="c-result" style="color: #10b981;">+20% (Increase)</div>
            <div style="color: #94a3b8;">Difference: <span id="c-diff">20</span></div>
        </div>

        <div id="tip" class="tab-content">
            <h2>Tip Calculator</h2>
            <div class="calc-group">
                <label>Bill Amount</label>
                <input type="number" id="t-bill" value="50" min="0">
            </div>
            <div class="calc-group">
                <label>Tip Percentage</label>
                <div class="tip-btns">
                    <button class="tip-btn" data-val="10">10%</button>
                    <button class="tip-btn active" data-val="15">15%</button>
                    <button class="tip-btn" data-val="18">18%</button>
                    <button class="tip-btn" data-val="20">20%</button>
                    <button class="tip-btn" data-val="25">25%</button>
                </div>
                <input type="number" id="t-custom" value="15" min="0" placeholder="Custom %">
            </div>
            <div class="calc-group">
                <label>Number of People</label>
                <input type="number" id="t-people" value="1" min="1">
            </div>
            <div class="result" style="font-size: 18px;">
                Tip Amount: $<span id="t-tip-amt">7.50</span><br>
                Total Bill: $<span id="t-total">57.50</span><br>
                Per Person: $<span id="t-person">57.50</span>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/calculator.js"></script>
</body>
</html>
