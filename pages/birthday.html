<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Calculator - ToolCanvas</title>
    <meta name="description" content="Calculate your exact age, next birthday countdown, zodiac sign, and fun facts about your birth date.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300f5ff'/><path d='M30 70 L50 30 L70 70' stroke='white' stroke-width='8' fill='none'/></svg>">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        .birthday-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .stat-card {
            text-align: center;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 12px;
            min-width: 80px;
        }
        .countdown-val {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--secondary);
        }
        .countdown-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        #exact-age-display {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--tertiary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.2;
        }
        .fun-fact {
            margin-top: 2rem;
            text-align: center;
            padding: 2rem;
            background: rgba(244, 114, 182, 0.1);
            border: 1px solid rgba(244, 114, 182, 0.2);
            border-radius: 16px;
        }
        .fun-fact-text {
            font-size: 1.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }
        .fun-fact-highlight {
            color: var(--tertiary);
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
        }
        #results-section {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #results-section.show {
            display: block;
            opacity: 1;
        }
        .error-message {
            color: var(--danger);
            text-align: center;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>
    </div>
    
    <div class="app-container">
        <header class="tool-header" id="tool-nav"></header>
        
        <main class="tool-body">
            <div class="tool-section glass-card">
                <h2>Enter Birthdate</h2>
                <div class="input-group">
                    <input type="date" id="birthdate-input" class="input-field" max="">
                </div>
                <button id="calculate-btn" class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 1rem;">Calculate My Life</button>
                <div id="error-msg" class="error-message">Please select a valid past date.</div>
            </div>

            <div id="results-section" class="tool-section">
                <div class="glass-card">
                    <div id="exact-age-display">0 Years, 0 Months, 0 Days</div>
                    
                    <div class="fun-fact">
                        <div class="fun-fact-text">You've been alive for <span id="fact-days" class="fun-fact-highlight">0</span> days!</div>
                    </div>

                    <div class="birthday-grid">
                        <div class="glass-card stat-card">
                            <div class="stat-value" id="total-hours">0</div>
                            <div class="stat-label">Total Hours Lived</div>
                        </div>
                        <div class="glass-card stat-card">
                            <div class="stat-value" id="total-minutes">0</div>
                            <div class="stat-label">Total Minutes Lived</div>
                        </div>
                        <div class="glass-card stat-card">
                            <div class="stat-value" id="day-of-week">-</div>
                            <div class="stat-label">Day of Birth</div>
                        </div>
                        <div class="glass-card stat-card">
                            <div class="stat-value" id="zodiac-sign">-</div>
                            <div class="stat-label">Zodiac Sign</div>
                        </div>
                        <div class="glass-card stat-card">
                            <div class="stat-value" id="chinese-zodiac">-</div>
                            <div class="stat-label">Chinese Zodiac</div>
                        </div>
                        <div class="glass-card stat-card">
                            <div class="stat-value" id="birthstone">-</div>
                            <div class="stat-label">Birthstone</div>
                        </div>
                        <div class="glass-card stat-card">
                            <div class="stat-value" id="season">-</div>
                            <div class="stat-label">Season Born</div>
                        </div>
                    </div>
                </div>

                <div class="glass-card" style="margin-top: 2rem; text-align: center;">
                    <h3>Time Until Next Birthday</h3>
                    <div class="countdown-container">
                        <div class="countdown-item">
                            <div class="countdown-val" id="cd-days">00</div>
                            <div class="countdown-label">Days</div>
                        </div>
                        <div class="countdown-item">
                            <div class="countdown-val" id="cd-hours">00</div>
                            <div class="countdown-label">Hours</div>
                        </div>
                        <div class="countdown-item">
                            <div class="countdown-val" id="cd-minutes">00</div>
                            <div class="countdown-label">Mins</div>
                        </div>
                        <div class="countdown-item">
                            <div class="countdown-val" id="cd-seconds">00</div>
                            <div class="countdown-label">Secs</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/birthday.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof createToolNav === 'function') {
                createToolNav('birthday');
            }
        });
    </script>
</body>
</html>
