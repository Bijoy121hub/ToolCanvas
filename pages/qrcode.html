<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolCanvas - QR Code Generator & Scanner</title>
    <meta name="description" content="Generate custom QR codes and scan existing ones.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300f5ff'/></svg>">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="stylesheet" href="../css/animations.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; cursor: pointer; border-radius: 999px; }
        .tab-btn.active { background: #00f5ff; color: #000; font-weight: bold; }
        .tab-content { display: none; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(20px); }
        .tab-content.active { display: block; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px){ .grid-2 { grid-template-columns: 1fr; } }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; }
        .form-control { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff; font-size: 16px; }
        select.form-control { cursor: pointer; background: #1a1a2e; }
        
        .qr-display { background: #fff; padding: 20px; border-radius: 16px; display: flex; justify-content: center; align-items: center; min-height: 250px; }
        #qr-output { display: flex; justify-content: center; }
        
        .btn-primary { background: #00f5ff; color: #000; padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; padding: 12px 20px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; cursor: pointer; width: 100%; margin-top: 10px; }
        
        .color-pickers { display: flex; gap: 10px; }
        .color-pickers input[type="color"] { width: 50px; height: 50px; padding: 0; border: none; border-radius: 8px; cursor: pointer; background: transparent; }
        
        #qr-reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 2px solid #00f5ff; }
        .scan-result { margin-top: 20px; padding: 15px; background: rgba(16, 185, 129, 0.1); border-left: 4px solid #10b981; border-radius: 0 12px 12px 0; word-break: break-all; }
        
        .history-list { margin-top: 20px; max-height: 200px; overflow-y: auto; }
        .history-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .history-item:last-child { border: none; }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
    </div>
    
    <header class="tool-header" id="tool-nav"></header>

    <main class="tool-container">
        <h1>QR Code Tools</h1>
        <div class="tabs">
            <button class="tab-btn active" data-tab="generator">Generator</button>
            <button class="tab-btn" data-tab="scanner">Scanner</button>
        </div>

        <div id="generator" class="tab-content active">
            <div class="grid-2">
                <div class="qr-controls">
                    <div class="form-group">
                        <label>Content Type</label>
                        <select id="qr-type" class="form-control">
                            <option value="text">Text / URL</option>
                            <option value="email">Email</option>
                            <option value="phone">Phone</option>
                            <option value="wifi">WiFi Network</option>
                        </select>
                    </div>
                    
                    <div id="input-text" class="input-section">
                        <div class="form-group">
                            <label>Content</label>
                            <textarea id="qr-content" class="form-control" rows="4" placeholder="Enter text or URL...">https://toolcanvas.com</textarea>
                        </div>
                    </div>
                    
                    <div id="input-wifi" class="input-section" style="display: none;">
                        <div class="form-group"><label>Network Name (SSID)</label><input type="text" id="wifi-ssid" class="form-control"></div>
                        <div class="form-group"><label>Password</label><input type="text" id="wifi-pass" class="form-control"></div>
                        <div class="form-group"><label>Encryption</label>
                            <select id="wifi-enc" class="form-control"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">None</option></select>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Colors (FG & BG)</label>
                            <div class="color-pickers">
                                <input type="color" id="qr-color-fg" value="#000000">
                                <input type="color" id="qr-color-bg" value="#ffffff">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Size</label>
                            <select id="qr-size" class="form-control">
                                <option value="128">128x128</option>
                                <option value="256" selected>256x256</option>
                                <option value="512">512x512</option>
                            </select>
                        </div>
                    </div>
                    
                    <button class="btn-primary" id="btn-download">Download PNG</button>
                </div>
                
                <div class="qr-preview">
                    <div class="qr-display">
                        <div id="qr-output"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="scanner" class="tab-content">
            <div style="text-align: center; margin-bottom: 20px;">
                <div id="qr-reader"></div>
                <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <button class="btn-primary" id="btn-scan-start" style="width: auto;">Start Camera</button>
                    <button class="btn-secondary" id="btn-scan-stop" style="width: auto; display: none;">Stop Camera</button>
                    <label class="btn-secondary" style="width: auto; margin-top: 10px; display: inline-block;">
                        Upload Image <input type="file" id="qr-upload" accept="image/*" style="display: none;">
                    </label>
                </div>
            </div>
            
            <div id="scan-result-container" class="scan-result" style="display: none;">
                <h3 style="margin-top: 0; color: #10b981;">Scan Result</h3>
                <div id="scan-text" style="margin-bottom: 10px; font-size: 18px;"></div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-primary" id="btn-copy-scan" style="width: auto; padding: 8px 15px; font-size: 14px;">Copy</button>
                    <a id="scan-link" target="_blank" style="display: none;" class="btn-secondary" style="width: auto; padding: 8px 15px; font-size: 14px; text-decoration: none;">Open Link</a>
                </div>
            </div>
            
            <div style="margin-top: 30px;">
                <h3>Scan History</h3>
                <div class="history-list" id="scan-history"></div>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/qrcode-tool.js"></script>
</body>
</html>
